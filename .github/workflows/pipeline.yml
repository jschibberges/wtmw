name: Weekly Pipeline

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. These two slots cover 04:00 Europe/Berlin
    # across standard time and daylight saving time; the gate job below keeps
    # only the exact 04:00 Berlin execution.
    - cron: "0 2 * * 1"
    - cron: "0 3 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.berlin-time.outputs.should_run }}
      berlin_time: ${{ steps.berlin-time.outputs.berlin_time }}
    steps:
      - name: Check Berlin runtime window
        id: berlin-time
        shell: bash
        run: |
          berlin_time="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
          berlin_day="$(TZ=Europe/Berlin date '+%u')"
          berlin_hour="$(TZ=Europe/Berlin date '+%H')"
          echo "berlin_time=${berlin_time}" >> "$GITHUB_OUTPUT"
          if [ "$berlin_day" = "1" ] && [ "$berlin_hour" = "04" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  pipeline:
    needs: gate
    if: needs.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m spacy download de_core_news_sm

      - name: Show effective runtime
        run: |
          echo "Berlin time gate: ${{ needs.gate.outputs.berlin_time }}"
          date -u '+UTC time: %Y-%m-%d %H:%M UTC'
          TZ=Europe/Berlin date '+Berlin time: %Y-%m-%d %H:%M %Z'

      - name: Run scraping pipeline
        run: python scrape_talkshows.py

      - name: Run analysis pipeline
        run: python analyze_talkshows.py

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data bertopic_tuning_results.csv
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh dashboard data [skip ci]"
          git push

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            data
            bertopic_tuning_results.csv
          if-no-files-found: warn
